<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Yu Gothic UI', 'Meiryo', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- ヘッダー -->
  <text x="40" y="78" font-size="44" font-weight="700" fill="#1565c0">ufodb_v0 のモジュール構成</text>
  <text x="40" y="128" font-size="22" fill="#333333">UnionFind（番号）→ Ufdb（キー）→ Db（DB名）と下から包み、保存とREPLはfeatureで外付けしている。</text>

  <!-- パネル（左2列を1枚に） -->
  <rect x="40" y="165" width="1040" height="680" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <rect x="1100" y="165" width="460" height="680" rx="10" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- ① ファイルと呼び出しの向き -->
  <text x="65" y="212" font-size="24" font-weight="700" fill="#222222">① ファイルと呼び出しの向き</text>

  <g text-anchor="middle">
    <!-- cli -->
    <rect x="65" y="240" width="330" height="80" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
    <text x="230" y="273" font-size="22" font-weight="700" fill="#0d47a1">main.rs（REPL）</text>
    <text x="230" y="302" font-size="16" fill="#333333">1行ずつ読んでコマンドを実行</text>

    <rect x="420" y="240" width="330" height="80" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
    <text x="585" y="273" font-size="22" font-weight="700" fill="#0d47a1">snapshot.rs</text>
    <text x="585" y="302" font-size="16" fill="#333333">SNAPSHOT用にUfdbをHTMLにする</text>

    <!-- storage -->
    <rect x="65" y="350" width="330" height="80" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
    <text x="230" y="383" font-size="22" font-weight="700" fill="#0d47a1">db.rs（Db）</text>
    <text x="230" y="412" font-size="16" fill="#333333">DB名 → Ufdb の HashMap</text>

    <rect x="420" y="350" width="330" height="80" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
    <text x="585" y="383" font-size="22" font-weight="700" fill="#0d47a1">storage.rs</text>
    <text x="585" y="412" font-size="16" fill="#333333">Ufdb ⇄ JSON（save / load）</text>

    <!-- コア -->
    <rect x="65" y="460" width="685" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="407" y="493" font-size="22" font-weight="700" fill="#0d47a1">lib.rs（Ufdb）</text>
    <text x="407" y="522" font-size="16" fill="#333333">キー（文字列）を番号に変えて、下の2つに任せる</text>

    <rect x="65" y="570" width="330" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="230" y="603" font-size="22" font-weight="700" fill="#0d47a1">union_find.rs（UnionFind）</text>
    <text x="230" y="632" font-size="16" fill="#333333">番号だけを扱う（parent / size）</text>

    <rect x="420" y="570" width="330" height="80" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="585" y="603" font-size="22" font-weight="700" fill="#0d47a1">graph.rs（Graph）</text>
    <text x="585" y="632" font-size="16" fill="#333333">MERGEで実際につないだ辺</text>

    <!-- ディスク -->
    <rect x="420" y="695" width="330" height="80" rx="6" fill="#eeeeee" stroke="#757575" stroke-width="2"/>
    <text x="585" y="728" font-size="22" font-weight="700" fill="#424242">&lt;DB名&gt;.json</text>
    <text x="585" y="757" font-size="16" fill="#333333">data_dir に 1DB = 1ファイル</text>
  </g>

  <!-- 呼び出しの矢印 -->
  <g stroke="#555555" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="397" y1="280" x2="414" y2="280"/>
    <line x1="230" y1="322" x2="230" y2="344"/>
    <line x1="330" y1="322" x2="470" y2="344"/>
    <line x1="397" y1="390" x2="414" y2="390"/>
    <line x1="230" y1="432" x2="230" y2="454"/>
    <line x1="585" y1="432" x2="585" y2="454"/>
    <line x1="230" y1="542" x2="230" y2="564"/>
    <line x1="585" y1="542" x2="585" y2="564"/>
    <path d="M 752 390 H 764 V 735 H 758"/>
  </g>

  <!-- featureの括り -->
  <path d="M 778 240 H 788 V 320 H 778" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="802" y="273" font-size="19" font-weight="700" fill="#1565c0">cli feature</text>
  <text x="802" y="302" font-size="15" fill="#555555">clap / open / tiny_http</text>

  <path d="M 778 350 H 788 V 430 H 778" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="802" y="383" font-size="19" font-weight="700" fill="#1565c0">storage feature</text>
  <text x="802" y="412" font-size="15" fill="#555555">directories / serde_json</text>

  <path d="M 778 460 H 788 V 650 H 778" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="802" y="535" font-size="19" font-weight="700" fill="#1565c0">コア（常にあり）</text>
  <text x="802" y="564" font-size="15" fill="#555555">OSの機能を使わない</text>
  <text x="802" y="588" font-size="15" fill="#555555">→ WASMでもビルドできる</text>

  <text x="65" y="810" font-size="17" fill="#555555">矢印は「呼び出す」向き。下の層は上の層を知らない（cli は storage を含む）</text>

  <!-- ② 誰がどこまで使うか -->
  <text x="1125" y="212" font-size="24" font-weight="700" fill="#222222">② 誰がどこまで使うか</text>

  <rect x="1120" y="240" width="420" height="125" rx="6" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="1140" y="276" font-size="20" font-weight="700" fill="#424242">CLI（このリポジトリのbin）</text>
  <text x="1140" y="310" font-size="18" fill="#222222">features: cli（デフォルト）</text>
  <text x="1140" y="344" font-size="19" font-weight="700" fill="#1565c0">→ ①の全部</text>

  <rect x="1120" y="385" width="420" height="125" rx="6" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="1140" y="421" font-size="20" font-weight="700" fill="#424242">Playground（WASM）</text>
  <text x="1140" y="455" font-size="18" fill="#222222">default-features = false</text>
  <text x="1140" y="489" font-size="19" font-weight="700" fill="#1565c0">→ コアだけ（db・storageなし）</text>

  <rect x="1120" y="530" width="420" height="125" rx="6" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="1140" y="566" font-size="20" font-weight="700" fill="#424242">Studio（Tauri）の計画</text>
  <text x="1140" y="600" font-size="18" fill="#222222">features = ["storage"]</text>
  <text x="1140" y="634" font-size="19" font-weight="700" fill="#1565c0">→ コア + db + storage</text>

  <rect x="1120" y="675" width="420" height="125" rx="6" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="1140" y="711" font-size="20" font-weight="700" fill="#e65100">いまのStudio</text>
  <text x="1140" y="745" font-size="18" fill="#222222">features を指定せずに path 参照</text>
  <text x="1140" y="779" font-size="19" font-weight="700" fill="#1565c0">→ cli の依存（clap など）も入る</text>

  <text x="1560" y="880" font-size="15" text-anchor="end" fill="#9e9e9e">ufodb_v0 設計資料</text>
</svg>
