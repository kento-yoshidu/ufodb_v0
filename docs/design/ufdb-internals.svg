<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Yu Gothic UI', 'Meiryo', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- ヘッダー -->
  <text x="40" y="78" font-size="44" font-weight="700" fill="#1565c0">Ufdb の中身：keys・uf・graph</text>
  <text x="40" y="128" font-size="22" fill="#333333">keys がキーを番号に変え、uf がその番号で速く計算し、graph がつないだ辺を記録する。</text>

  <!-- パネル -->
  <rect x="40" y="165" width="480" height="680" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <rect x="540" y="165" width="540" height="680" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <rect x="1100" y="165" width="460" height="680" rx="10" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- ① 3つのフィールド -->
  <text x="65" y="212" font-size="24" font-weight="700" fill="#222222">① 3つのフィールド</text>
  <text x="65" y="250" font-size="17" fill="#555555">例: MERGE apple banana / MERGE banana cherry</text>
  <text x="65" y="274" font-size="17" fill="#555555">　　INSERT fig</text>

  <!-- keys -->
  <rect x="65" y="295" width="430" height="115" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="85" y="330" font-size="22" font-weight="700" fill="#0d47a1">keys</text>
  <text x="160" y="330" font-size="16" fill="#333333">キー（文字列）→ 番号</text>
  <g font-size="18" fill="#222222">
    <text x="85" y="365">apple → 0　banana → 1</text>
    <text x="85" y="395">cherry → 2　fig → 3</text>
  </g>

  <!-- graph（記録） -->
  <rect x="65" y="425" width="430" height="135" rx="6" fill="#ffffff" stroke="#1565c0" stroke-width="2"/>
  <text x="85" y="460" font-size="22" font-weight="700" fill="#0d47a1">graph（記録）</text>
  <text x="250" y="460" font-size="16" fill="#333333">MERGEで実際につないだ辺</text>
  <g font-size="18" fill="#222222">
    <text x="85" y="510">apple ― banana ― cherry　　fig</text>
  </g>
  <text x="85" y="542" font-size="16" fill="#555555">UNMERGE・SNAPSHOT で使う</text>

  <!-- uf（計算用）: 番号 = parent / size の添字 -->
  <rect x="65" y="575" width="430" height="215" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="85" y="610" font-size="22" font-weight="700" fill="#0d47a1">uf（計算用）</text>
  <text x="230" y="610" font-size="16" fill="#333333">SAME・SIZE に速く答える</text>
  <g font-size="16" fill="#555555">
    <text x="85" y="648">番号</text>
    <text x="85" y="676">（キー）</text>
    <text x="85" y="708" font-size="18" fill="#222222">parent</text>
    <text x="85" y="738" font-size="18" fill="#222222">size</text>
  </g>
  <g text-anchor="middle">
    <g font-size="18" font-weight="700" fill="#0d47a1">
      <text x="210" y="648">0</text>
      <text x="290" y="648">1</text>
      <text x="370" y="648">2</text>
      <text x="450" y="648">3</text>
    </g>
    <g font-size="16" fill="#555555">
      <text x="210" y="676">apple</text>
      <text x="290" y="676">banana</text>
      <text x="370" y="676">cherry</text>
      <text x="450" y="676">fig</text>
    </g>
    <g font-size="18" fill="#222222">
      <text x="210" y="708">0</text>
      <text x="290" y="708">0</text>
      <text x="370" y="708">0</text>
      <text x="450" y="708">3</text>
      <text x="210" y="738">3</text>
      <text x="290" y="738">1</text>
      <text x="370" y="738">1</text>
      <text x="450" y="738">1</text>
    </g>
  </g>
  <line x1="85" y1="688" x2="475" y2="688" stroke="#90caf9" stroke-width="1"/>
  <text x="85" y="772" font-size="16" fill="#555555">経路圧縮で平らになり、どの辺かは残らない</text>

  <text x="65" y="815" font-size="17" fill="#555555">keys の番号 = parent / size の添字。uf は文字列を知らない</text>

  <!-- ② 操作ごとに触るところ -->
  <text x="565" y="212" font-size="24" font-weight="700" fill="#222222">② 操作ごとに触るところ</text>

  <g font-size="18" font-weight="700" fill="#424242" text-anchor="middle">
    <text x="732" y="262">keys</text>
    <text x="867" y="262">graph</text>
    <text x="1002" y="262">uf</text>
  </g>
  <line x1="560" y1="278" x2="1065" y2="278" stroke="#9e9e9e" stroke-width="1.5"/>

  <g font-size="18" font-weight="700" fill="#0d47a1">
    <text x="565" y="320">INSERT</text>
    <text x="565" y="390">MERGE</text>
    <text x="565" y="460">SAME</text>
    <text x="565" y="484" font-size="16">/ SIZE</text>
    <text x="565" y="530">UNMERGE</text>
  </g>
  <g font-size="17" fill="#222222" text-anchor="middle">
    <text x="732" y="320">追加</text>
    <text x="867" y="320">ノード追加</text>
    <text x="1002" y="320">add</text>

    <text x="732" y="390">なければ追加</text>
    <text x="867" y="390">つないだら追加</text>
    <text x="1002" y="390">unite</text>

    <text x="732" y="470">番号を引く</text>
    <text x="867" y="470" fill="#9e9e9e">―</text>
    <text x="1002" y="470">find</text>

    <text x="732" y="530" fill="#9e9e9e">―</text>
    <text x="867" y="530">辺を外す</text>
    <text x="1002" y="530">reset → 再生</text>
  </g>
  <g stroke="#e0e0e0" stroke-width="1">
    <line x1="560" y1="350" x2="1065" y2="350"/>
    <line x1="560" y1="420" x2="1065" y2="420"/>
    <line x1="560" y1="500" x2="1065" y2="500"/>
  </g>

  <line x1="560" y1="560" x2="1065" y2="560" stroke="#e0e0e0" stroke-width="1"/>
  <text x="565" y="600" font-size="18" font-weight="700" fill="#0d47a1">GROUPS</text>
  <g font-size="17" fill="#222222" text-anchor="middle">
    <text x="732" y="600">全キーを回す</text>
    <text x="867" y="600" fill="#9e9e9e">―</text>
    <text x="1002" y="600">find</text>
  </g>

  <g font-size="20" fill="#222222">
    <text x="565" y="700">・SAME / SIZE は uf だけで答える → 速い</text>
    <text x="565" y="740">・つながりを減らす操作だけ作り直す</text>
    <text x="565" y="780">・作り直しは1回 O(E・α(E))</text>
  </g>

  <!-- ③ SAME apple cherry の流れ -->
  <text x="1125" y="212" font-size="24" font-weight="700" fill="#222222">③ SAME apple cherry の流れ</text>

  <rect x="1120" y="240" width="420" height="150" rx="6" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="1140" y="276" font-size="20" font-weight="700" fill="#424242">1. main.rs → Db</text>
  <text x="1140" y="318" font-size="18" fill="#222222">db.get_mut("ufdb")</text>
  <text x="1140" y="360" font-size="18" fill="#222222">→ 選んでいる DB の Ufdb を取る</text>

  <rect x="1120" y="410" width="420" height="150" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="1140" y="446" font-size="20" font-weight="700" fill="#0d47a1">2. keys で番号に変える</text>
  <text x="1140" y="488" font-size="18" fill="#222222">apple → 0　cherry → 2</text>
  <text x="1140" y="528" font-size="16" fill="#555555">どちらか未登録なら、ここで false</text>

  <rect x="1120" y="580" width="420" height="150" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="1140" y="616" font-size="20" font-weight="700" fill="#0d47a1">3. uf で根を比べる</text>
  <text x="1140" y="658" font-size="18" fill="#222222">find(0) = 0　find(2) = 0</text>
  <text x="1140" y="700" font-size="19" font-weight="700" fill="#1565c0">→ 同じ根なので true</text>

  <text x="1125" y="782" font-size="17" fill="#555555">graph は見ない（辺をたどると遅いため）</text>

  <text x="1560" y="880" font-size="15" text-anchor="end" fill="#9e9e9e">ufodb_v0 設計資料</text>
</svg>
