<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Yu Gothic UI', 'Meiryo', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- ヘッダー -->
  <text x="40" y="78" font-size="44" font-weight="700" fill="#1565c0">HDDとSSD：抽象化が隠すもの、隠さないもの</text>
  <text x="40" y="128" font-size="22" fill="#333333">隠すのは「どうやって読むか」。「どれだけ速いか」は隠さない。だからコードは分けず、コストの見積もりを変える。</text>

  <!-- パネル -->
  <rect x="40" y="165" width="480" height="680" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <rect x="540" y="165" width="540" height="680" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <rect x="1100" y="165" width="460" height="680" rx="10" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- ① DBから見えるものは同じ -->
  <text x="65" y="212" font-size="24" font-weight="700" fill="#222222">① DBから見えるものは同じ</text>

  <g text-anchor="middle">
    <rect x="65" y="240" width="430" height="88" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="280" y="277" font-size="22" font-weight="700" fill="#0d47a1">DB</text>
    <text x="280" y="307" font-size="16" fill="#333333">「ファイルのNバイト目を読む／書く」</text>

    <rect x="65" y="350" width="430" height="88" rx="6" fill="#eeeeee" stroke="#757575" stroke-width="2"/>
    <text x="280" y="387" font-size="22" font-weight="700" fill="#424242">OS（ファイルシステム）</text>
    <text x="280" y="417" font-size="16" fill="#333333">「そのバイトはあのブロック」</text>

    <rect x="65" y="480" width="205" height="240" rx="6" fill="#ffffff" stroke="#757575" stroke-width="2"/>
    <text x="167" y="516" font-size="22" font-weight="700" fill="#424242">HDD</text>
    <rect x="85" y="615" width="165" height="56" rx="4" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.5"/>
    <text x="167" y="650" font-size="17" fill="#333333">円盤とヘッド</text>
    <text x="167" y="702" font-size="16" fill="#555555">上書きできる</text>

    <rect x="290" y="480" width="205" height="240" rx="6" fill="#ffffff" stroke="#757575" stroke-width="2"/>
    <text x="392" y="516" font-size="22" font-weight="700" fill="#424242">SSD</text>
    <rect x="310" y="535" width="165" height="56" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5"/>
    <text x="392" y="570" font-size="17" font-weight="700" fill="#e65100">FTL（変換層）</text>
    <rect x="310" y="615" width="165" height="56" rx="4" fill="#eeeeee" stroke="#9e9e9e" stroke-width="1.5"/>
    <text x="392" y="650" font-size="17" fill="#333333">フラッシュメモリ</text>
    <text x="392" y="702" font-size="16" fill="#555555">上書きできない</text>
  </g>

  <g stroke="#555555" stroke-width="2" marker-end="url(#arrow)">
    <line x1="280" y1="330" x2="280" y2="344"/>
    <line x1="167" y1="440" x2="167" y2="474"/>
    <line x1="392" y1="440" x2="392" y2="474"/>
    <line x1="392" y1="593" x2="392" y2="609"/>
  </g>

  <text x="65" y="768" font-size="17" fill="#555555">違いはOSより下に閉じ込められている</text>
  <text x="65" y="800" font-size="17" fill="#555555">FTLがSSDを「上書きできる装置」に見せる</text>

  <!-- ② 違うのはコスト -->
  <text x="565" y="212" font-size="24" font-weight="700" fill="#222222">② 違うのはコスト</text>

  <g stroke="#bdbdbd" stroke-width="1.5">
    <rect x="565" y="240" width="190" height="50" fill="#eeeeee"/>
    <rect x="755" y="240" width="150" height="50" fill="#eeeeee"/>
    <rect x="905" y="240" width="150" height="50" fill="#eeeeee"/>

    <rect x="565" y="290" width="190" height="100" fill="#ffffff"/>
    <rect x="755" y="290" width="150" height="100" fill="#ffebee"/>
    <rect x="905" y="290" width="150" height="100" fill="#e8f5e9"/>

    <rect x="565" y="390" width="190" height="100" fill="#ffffff"/>
    <rect x="755" y="390" width="150" height="100" fill="#e8f5e9"/>
    <rect x="905" y="390" width="150" height="100" fill="#e8f5e9"/>

    <rect x="565" y="490" width="190" height="100" fill="#ffffff"/>
    <rect x="755" y="490" width="150" height="100" fill="#ffffff"/>
    <rect x="905" y="490" width="150" height="100" fill="#ffffff"/>
  </g>

  <g text-anchor="middle">
    <text x="830" y="273" font-size="20" font-weight="700" fill="#424242">HDD</text>
    <text x="980" y="273" font-size="20" font-weight="700" fill="#424242">SSD</text>

    <text x="660" y="335" font-size="19" font-weight="700" fill="#222222">離れた場所を読む</text>
    <text x="660" y="364" font-size="15" fill="#555555">ランダム読み</text>
    <text x="830" y="335" font-size="20" font-weight="700" fill="#c62828">遅い</text>
    <text x="830" y="364" font-size="15" fill="#555555">約10ms</text>
    <text x="980" y="335" font-size="20" font-weight="700" fill="#2e7d32">速い</text>
    <text x="980" y="364" font-size="15" fill="#555555">約0.1ms</text>

    <text x="660" y="435" font-size="19" font-weight="700" fill="#222222">続けて読む</text>
    <text x="660" y="464" font-size="15" fill="#555555">シーケンシャル読み</text>
    <text x="830" y="447" font-size="20" font-weight="700" fill="#2e7d32">速い</text>
    <text x="980" y="447" font-size="20" font-weight="700" fill="#2e7d32">速い</text>

    <text x="660" y="547" font-size="19" font-weight="700" fill="#222222">書き込み</text>
    <text x="830" y="547" font-size="17" fill="#222222">上書きできる</text>
    <text x="980" y="535" font-size="17" fill="#222222">中では上書き不可</text>
    <text x="980" y="564" font-size="15" fill="#555555">書ける回数に寿命</text>
  </g>

  <text x="565" y="660" font-size="22" font-weight="700" fill="#1565c0">同じ read でも時間が約100倍違う</text>
  <g font-size="20" fill="#222222">
    <text x="565" y="712">・インターフェースは同じ</text>
    <text x="565" y="752">・「何を何回呼ぶと得か」が変わる</text>
  </g>

  <!-- ③ DBの対応は3段階 -->
  <text x="1125" y="212" font-size="24" font-weight="700" fill="#222222">③ DBの対応は3段階</text>

  <rect x="1120" y="240" width="420" height="165" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="1140" y="276" font-size="20" font-weight="700" fill="#0d47a1">1. 設定値で調整する（大半のDB）</text>
  <g font-size="18" fill="#222222">
    <text x="1140" y="314">コードは同じ。コストの見積もりを変える</text>
    <text x="1140" y="348">例: PostgreSQL の random_page_cost</text>
    <text x="1140" y="382">4.0（HDD前提）→ 1.1（SSD）</text>
  </g>

  <rect x="1120" y="425" width="420" height="165" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="1140" y="461" font-size="20" font-weight="700" fill="#0d47a1">2. データ構造を選ぶ</text>
  <g font-size="18" fill="#222222">
    <text x="1140" y="499">B+木: ページをその場で書き換える</text>
    <text x="1140" y="533">LSM木: 追記だけで書く</text>
    <text x="1140" y="567">分岐ではなくストレージエンジンの選択</text>
  </g>

  <rect x="1120" y="610" width="420" height="131" rx="6" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="1140" y="646" font-size="20" font-weight="700" fill="#424242">3. 抽象化を破る（少数）</text>
  <g font-size="18" fill="#222222">
    <text x="1140" y="684">ファイルシステムを通さず</text>
    <text x="1140" y="718">SSDを直接扱う（Aerospikeなど）</text>
  </g>

  <text x="1120" y="784" font-size="17" fill="#555555">ufodbはJSONを丸ごと読み書きするので、</text>
  <text x="1120" y="814" font-size="17" fill="#555555">いまは差が全体の速さにしか出ない</text>

  <text x="1560" y="880" font-size="15" text-anchor="end" fill="#9e9e9e">ufodb_v0 設計資料</text>
</svg>
