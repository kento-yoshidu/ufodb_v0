<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Yu Gothic UI', 'Meiryo', 'Hiragino Sans', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>

  <!-- ヘッダー -->
  <text x="40" y="78" font-size="44" font-weight="700" fill="#1565c0">ストレージの層とB+木</text>
  <text x="40" y="128" font-size="22" fill="#333333">「どこに置くか」は2種類ある。OSはディスク上の物理ブロックを、DBはファイル内の何バイト目かを決める。</text>

  <!-- パネル -->
  <rect x="40" y="165" width="480" height="680" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <rect x="540" y="165" width="540" height="680" rx="10" fill="#fafafa" stroke="#e0e0e0"/>
  <rect x="1100" y="165" width="460" height="680" rx="10" fill="#fafafa" stroke="#e0e0e0"/>

  <!-- ① 層ごとの担当 -->
  <text x="65" y="212" font-size="24" font-weight="700" fill="#222222">① 層ごとの担当</text>

  <g text-anchor="middle">
    <rect x="65" y="240" width="310" height="88" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="220" y="277" font-size="22" font-weight="700" fill="#0d47a1">クエリ</text>
    <text x="220" y="307" font-size="16" fill="#333333">「aliceの行をくれ」</text>

    <rect x="65" y="350" width="310" height="88" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="220" y="387" font-size="22" font-weight="700" fill="#0d47a1">B+木</text>
    <text x="220" y="417" font-size="16" fill="#333333">「aliceは7番ページにある」</text>

    <rect x="65" y="460" width="310" height="88" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="220" y="497" font-size="22" font-weight="700" fill="#0d47a1">ページ管理</text>
    <text x="220" y="527" font-size="16" fill="#333333">「7番ページ = 7 × 8KB バイト目」</text>

    <rect x="65" y="570" width="310" height="88" rx="6" fill="#eeeeee" stroke="#757575" stroke-width="2"/>
    <text x="220" y="607" font-size="22" font-weight="700" fill="#424242">OS（ファイルシステム）</text>
    <text x="220" y="637" font-size="16" fill="#333333">「そのバイトはあのブロック」</text>

    <rect x="65" y="680" width="310" height="88" rx="6" fill="#eeeeee" stroke="#757575" stroke-width="2"/>
    <text x="220" y="717" font-size="22" font-weight="700" fill="#424242">ディスク</text>
    <text x="220" y="747" font-size="16" fill="#333333">物理ブロック</text>
  </g>

  <g stroke="#555555" stroke-width="2" marker-end="url(#arrow)">
    <line x1="220" y1="330" x2="220" y2="344"/>
    <line x1="220" y1="440" x2="220" y2="454"/>
    <line x1="220" y1="550" x2="220" y2="564"/>
    <line x1="220" y1="660" x2="220" y2="674"/>
  </g>

  <path d="M 388 240 H 398 V 548 H 388" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="410" y="400" font-size="18" font-weight="700" fill="#1565c0">DBが決める</text>
  <path d="M 388 570 H 398 V 768 H 388" fill="none" stroke="#757575" stroke-width="2"/>
  <text x="410" y="675" font-size="18" font-weight="700" fill="#616161">OSが決める</text>

  <text x="65" y="810" font-size="17" fill="#555555">各層は一つ下の層の言葉しか知らない</text>

  <!-- ② B+木はページの上に載る -->
  <text x="565" y="212" font-size="24" font-weight="700" fill="#222222">② B+木はページの上に載る</text>

  <text x="580" y="256" font-size="17" fill="#555555">DBのファイル（8KBごとのページに区切る）</text>
  <g font-size="18" text-anchor="middle" stroke-width="1.5">
    <rect x="580" y="268" width="46" height="50" fill="#ffffff" stroke="#9e9e9e"/>
    <rect x="626" y="268" width="46" height="50" fill="#ffffff" stroke="#9e9e9e"/>
    <rect x="672" y="268" width="46" height="50" fill="#ffffff" stroke="#9e9e9e"/>
    <rect x="718" y="268" width="46" height="50" fill="#1565c0" stroke="#0d47a1"/>
    <rect x="764" y="268" width="46" height="50" fill="#ffffff" stroke="#9e9e9e"/>
    <rect x="810" y="268" width="46" height="50" fill="#ffffff" stroke="#9e9e9e"/>
    <rect x="856" y="268" width="46" height="50" fill="#ffffff" stroke="#9e9e9e"/>
    <rect x="902" y="268" width="46" height="50" fill="#bbdefb" stroke="#1565c0"/>
    <rect x="948" y="268" width="46" height="50" fill="#ffffff" stroke="#9e9e9e"/>
    <rect x="994" y="268" width="46" height="50" fill="#bbdefb" stroke="#1565c0"/>
    <g stroke="none" fill="#9e9e9e">
      <text x="603" y="300">0</text>
      <text x="649" y="300">1</text>
      <text x="695" y="300">2</text>
      <text x="741" y="300" fill="#ffffff" font-weight="700">3</text>
      <text x="787" y="300">4</text>
      <text x="833" y="300">5</text>
      <text x="879" y="300">6</text>
      <text x="925" y="300" fill="#0d47a1" font-weight="700">7</text>
      <text x="971" y="300">8</text>
      <text x="1017" y="300" fill="#0d47a1" font-weight="700">9</text>
    </g>
  </g>

  <g stroke="#555555" stroke-width="2" marker-end="url(#arrow)">
    <line x1="750" y1="452" x2="695" y2="512"/>
    <line x1="870" y1="452" x2="925" y2="512"/>
  </g>

  <g text-anchor="middle">
    <rect x="660" y="372" width="300" height="78" rx="6" fill="#1565c0" stroke="#0d47a1" stroke-width="2"/>
    <text x="810" y="403" font-size="20" font-weight="700" fill="#ffffff">ページ3（根）</text>
    <text x="810" y="433" font-size="17" fill="#ffffff">〜m は7番へ ｜ m〜 は9番へ</text>

    <rect x="580" y="518" width="220" height="78" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
    <text x="690" y="549" font-size="20" font-weight="700" fill="#0d47a1">ページ7（葉）</text>
    <text x="690" y="579" font-size="17" fill="#333333">alice ｜ bob ｜ …</text>

    <rect x="820" y="518" width="220" height="78" rx="6" fill="#bbdefb" stroke="#1565c0" stroke-width="2"/>
    <text x="930" y="549" font-size="20" font-weight="700" fill="#0d47a1">ページ9（葉）</text>
    <text x="930" y="579" font-size="17" fill="#333333">mike ｜ zoe ｜ …</text>
  </g>

  <g font-size="20" fill="#222222">
    <text x="580" y="660">・ノード1個 = ページ1枚</text>
    <text x="580" y="700">・子へのポインタ = ページ番号</text>
    <text x="580" y="740">・aliceを探すとき読むのは2枚だけ</text>
    <text x="580" y="780">・1ページに数百キー → 3〜4段で数億件</text>
  </g>

  <!-- ③ ufodbの現在地 -->
  <text x="1125" y="212" font-size="24" font-weight="700" fill="#222222">③ ufodbの現在地</text>

  <rect x="1120" y="240" width="420" height="240" rx="6" fill="#ffffff" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="1140" y="278" font-size="20" font-weight="700" fill="#424242">いま（storage.rs）</text>
  <g font-size="20" fill="#222222">
    <text x="1140" y="322">・1DB = 1つのJSONファイル</text>
    <text x="1140" y="360">・SAVEのたびに全体を書き出す</text>
    <text x="1140" y="398">・起動時に全体を読み込む</text>
  </g>
  <text x="1140" y="448" font-size="19" font-weight="700" fill="#1565c0">→ ファイル内の配置を決めなくてよい</text>

  <rect x="1120" y="510" width="420" height="258" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="1140" y="548" font-size="20" font-weight="700" fill="#0d47a1">ページとB+木が要るのは</text>
  <g font-size="20" fill="#222222">
    <text x="1140" y="592">・1件の変更で全体を書き直したくない</text>
    <text x="1140" y="630">・全体をメモリに載せられない</text>
    <text x="1140" y="668">・キーで一部だけ読みたい</text>
  </g>
  <text x="1140" y="718" font-size="19" font-weight="700" fill="#1565c0">→ ①の「ページ管理」から自分で作る</text>
  <text x="1140" y="748" font-size="19" font-weight="700" fill="#1565c0">　 ことになる</text>

  <text x="1560" y="880" font-size="15" text-anchor="end" fill="#9e9e9e">ufodb_v0 設計資料</text>
</svg>
